<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Realster — Orbital Camera</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1b1a18;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 88% 70% at 48% 40%, #2a2926 0%, #1b1a18 52%, #0e0d0c 100%);
      }
      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        perspective: 1480px;
        perspective-origin: 50% 45%;
        will-change: filter;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 11544px;
        transform-style: preserve-3d;
        transform-origin: 960px 540px;
        will-change: transform;
      }
      #page {
        display: block;
        width: 1920px;
        height: 11544px;
        box-shadow:
          0 48px 140px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 76% 70% at 50% 48%,
          transparent 38%,
          rgba(14, 13, 12, 0.42) 100%
        );
        opacity: 0.9;
      }
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.055;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="1"
      >
        <div id="stage">
          <div id="world" data-layout-allow-overflow>
            <img
              id="page"
              src="assets/full-page.png"
              width="1920"
              height="11544"
              alt="Realster Greater Boston real estate site"
            />
          </div>
        </div>
        <div id="vignette"></div>
        <div id="grain"></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const world = document.getElementById("world");
      const stage = document.getElementById("stage");
      const page = document.getElementById("page");

      // Camera state — single writer. Translate outside rotations (screen-aligned).
      // Zoomed-out panoramic orbital controls with dynamic transform origin tracking
      // so the page never zooms in as it scrolls down.
      // y negative = travel down the page. z negative = pull back (wider).
      const cam = { x: -60, y: 0, z: -920, rx: 14, ry: -20, rz: -2.5 };
      const drift = { dx: 0, dy: 0, drx: 0, dry: 0 };
      const travel = { blur: 0 };

      function applyCamera() {
        // Track the rotation center to the currently viewed section on the long page
        const currentCenterY = -cam.y + 540;
        world.style.transformOrigin = `960px ${currentCenterY}px`;
        world.style.transform =
          `translate3d(${cam.x + drift.dx}px, ${cam.y + drift.dy}px, ${cam.z}px)` +
          ` rotateX(${cam.rx + drift.drx}deg) rotateY(${cam.ry + drift.dry}deg) rotateZ(${cam.rz}deg)`;
        const b = travel.blur;
        stage.style.filter = b > 0.15 ? `blur(${b.toFixed(2)}px)` : "none";
      }

      applyCamera();
      gsap.set(page, { opacity: 0 });

      // Continuous organic 3D floating drift across the full flight
      const driftDriver = { p: 0 };
      tl.to(
        driftDriver,
        {
          p: Math.PI * 2 * 1.5,
          duration: 10,
          ease: "none",
          onUpdate: () => {
            drift.dx = Math.sin(driftDriver.p) * 6;
            drift.dy = Math.sin(driftDriver.p * 1.2) * 4.5;
            drift.drx = Math.sin(driftDriver.p * 0.7) * 0.35;
            drift.dry = Math.cos(driftDriver.p * 0.9) * 0.5;
            applyCamera();
          },
        },
        0,
      );

      // ── 0.00–0.60  Establish: fade in on wide 3D panoramic vantage
      tl.fromTo(
        page,
        { opacity: 0 },
        { opacity: 1, duration: 0.55, ease: "power2.out" },
        0.05,
      );

      // ── 0.50–2.00  LEG 1: Wide Orbital Arc into Hero & Search (panoramic zoomed-out framing)
      tl.fromTo(
        cam,
        { x: -70, y: -20, z: -920, rx: 14, ry: -20, rz: -2.5 },
        {
          x: -40,
          y: -100,
          z: -880,
          rx: 9,
          ry: -11,
          rz: -1,
          duration: 1.5,
          ease: "power3.out",
          onUpdate: applyCamera,
        },
        0.5,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 2.2, duration: 0.25, ease: "power2.out", onUpdate: applyCamera },
        0.5,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.7, ease: "power3.out", onUpdate: applyCamera },
        0.75,
      );

      // ── 2.00–4.10  LEG 2: Sweeping Zoomed-Out Counter-Orbit across Featured Exclusives & Showcase
      tl.to(
        cam,
        {
          x: 50,
          y: -1950,
          z: -900,
          rx: 11,
          ry: 14,
          rz: 2,
          duration: 2.1,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        2.0,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 3.2, duration: 0.35, ease: "power1.in", onUpdate: applyCamera },
        2.0,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.85, ease: "power3.out", onUpdate: applyCamera },
        2.7,
      );

      // ── 4.10–6.20  LEG 3: Expansive High-Altitude Orbit over Neighborhoods & Stats (Maintains Wide Overview)
      tl.to(
        cam,
        {
          x: -50,
          y: -5400,
          z: -920,
          rx: 12,
          ry: -14,
          rz: -1.5,
          duration: 2.1,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        4.1,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 3.5, duration: 0.32, ease: "power1.in", onUpdate: applyCamera },
        4.1,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.9, ease: "power3.out", onUpdate: applyCamera },
        4.7,
      );

      // ── 6.20–8.20  LEG 4: Wide Dynamic Orbit across How-It-Works & Browse Book (Generous UI Margins)
      tl.to(
        cam,
        {
          x: 40,
          y: -7700,
          z: -890,
          rx: 10,
          ry: 12,
          rz: 1.2,
          duration: 2.0,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        6.2,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 3.0, duration: 0.3, ease: "power2.out", onUpdate: applyCamera },
        6.2,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.85, ease: "power3.out", onUpdate: applyCamera },
        6.7,
      );

      // ── 8.20–10.0  LEG 5: Final Balanced Orbital Deceleration & Settle on FAQ & Contact
      tl.to(
        cam,
        {
          x: 0,
          y: -10150,
          z: -860,
          rx: 5,
          ry: -3,
          rz: 0,
          duration: 1.8,
          ease: "power3.out",
          onUpdate: applyCamera,
        },
        8.2,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 2.0, duration: 0.22, ease: "power2.out", onUpdate: applyCamera },
        8.2,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.7, ease: "power3.out", onUpdate: applyCamera },
        8.5,
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
