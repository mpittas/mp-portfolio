<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Umedio — 3D Orbital Clinic SaaS Showcase</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #06110f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #06110f;
      }

      /* ── Atmospheric Deep-Teal Brand Backdrop ── */
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 85% 70% at 50% 30%, rgba(45, 106, 79, 0.22) 0%, transparent 64%),
          radial-gradient(ellipse 100% 85% at 48% 42%, #0e2b24 0%, #081a16 50%, #040d0b 100%);
      }

      /* Ambient Volumetric Emerald & Sage Beams */
      #ambient-glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 18% 30%, rgba(82, 183, 136, 0.12) 0%, transparent 48%),
          radial-gradient(circle at 82% 40%, rgba(30, 86, 68, 0.15) 0%, transparent 52%),
          radial-gradient(circle at 50% 85%, rgba(45, 106, 79, 0.10) 0%, transparent 55%);
        pointer-events: none;
      }

      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #stage {
        position: absolute;
        inset: 0;
        perspective: 1450px;
        perspective-origin: 50% 45%;
        will-change: filter;
      }

      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 12000px;
        height: 4000px;
        transform-style: preserve-3d;
        transform-origin: 960px 540px;
        will-change: transform;
      }

      /* ── Floating 3D Homepage & Subpage UI Plates ── */
      .plane {
        position: absolute;
        overflow: hidden;
        border-radius: 20px;
        box-shadow:
          0 50px 140px rgba(0, 0, 0, 0.82),
          0 20px 60px rgba(3, 15, 12, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 0 80px rgba(45, 106, 79, 0.20);
        background: #0e2b24;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }

      .plane img.page-img {
        display: block;
        width: 1920px;
        height: 1080px;
      }

      /* Specular Glass Sheen reflecting light angles */
      .page-sheen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.14) 0%,
          transparent 35%,
          transparent 75%,
          rgba(82, 183, 136, 0.10) 100%
        );
        mix-blend-mode: overlay;
      }

      /* Dynamic Sweep Reveal Light Beam */
      #reveal-shimmer {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 40%,
          rgba(255, 255, 255, 0.16) 48%,
          rgba(82, 183, 136, 0.28) 50%,
          rgba(255, 255, 255, 0.16) 52%,
          transparent 60%
        );
        transform: translate(-100%, -100%);
        mix-blend-mode: screen;
      }

      /* Atmospheric Vignette */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 75% 68% at 50% 48%,
          transparent 35%,
          rgba(4, 13, 11, 0.55) 100%
        );
        opacity: 0.92;
      }

      /* High-End Cinematic Grain */
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="ambient-glow"></div>

      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="1"
      >
        <div id="stage" data-layout-allow-overflow>
          <div id="world" data-layout-allow-overflow>
            <!-- 1. Umedio Homepage Hero & Practice Management System -->
            <div
              class="plane"
              id="plane-home"
              style="left: 0px; top: 0px; width: 1920px; height: 1080px;"
            >
              <img
                class="page-img"
                src="assets/page-home.png"
                width="1920"
                height="1080"
                alt="Umedio Homepage"
              />
              <div class="page-sheen"></div>
              <div id="reveal-shimmer"></div>
            </div>

            <!-- 2. Workflows & UK Private Hospital Badges -->
            <div
              class="plane"
              id="plane-workflows"
              style="left: 2350px; top: 0px; width: 1920px; height: 1080px;"
            >
              <img
                class="page-img"
                src="assets/page-workflows.png"
                width="1920"
                height="1080"
                alt="Umedio Specialty Workflows"
              />
              <div class="page-sheen"></div>
            </div>

            <!-- 3. Practice Automation & Admin Features -->
            <div
              class="plane"
              id="plane-features"
              style="left: 4700px; top: 0px; width: 1920px; height: 1080px;"
            >
              <img
                class="page-img"
                src="assets/page-features.png"
                width="1920"
                height="1080"
                alt="Umedio Automation Features"
              />
              <div class="page-sheen"></div>
            </div>

            <!-- 4. Transparent Doctor Pricing Tiers -->
            <div
              class="plane"
              id="plane-pricing"
              style="left: 7050px; top: 0px; width: 1920px; height: 1080px;"
            >
              <img
                class="page-img"
                src="assets/page-pricing.png"
                width="1920"
                height="1080"
                alt="Umedio Transparent Pricing"
              />
              <div class="page-sheen"></div>
            </div>

            <!-- 5. Santis Clinic Case Study -->
            <div
              class="plane"
              id="plane-case-study"
              style="left: 9400px; top: 0px; width: 1920px; height: 1080px;"
            >
              <img
                class="page-img"
                src="assets/page-case-study.png"
                width="1920"
                height="1080"
                alt="Santis Clinic Case Study"
              />
              <div class="page-sheen"></div>
            </div>
          </div>
        </div>

        <div id="vignette"></div>
        <div id="grain"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const world = document.getElementById("world");
      const stage = document.getElementById("stage");
      const planeHome = document.getElementById("plane-home");
      const shimmer = document.getElementById("reveal-shimmer");

      // ── 3D Orbital Camera System ──
      const cam = {
        x: 80,
        y: 20,
        z: -870,
        rx: 16,
        ry: 21,
        rz: 2.4,
      };

      const drift = { dx: 0, dy: 0, drx: 0, dry: 0 };
      const travel = { blur: 0 };

      function applyCamera() {
        const currentCenterX = -cam.x + 960;
        const currentCenterY = -cam.y + 540;
        world.style.transformOrigin = `${currentCenterX}px ${currentCenterY}px`;
        world.style.transform =
          `translate3d(${cam.x + drift.dx}px, ${cam.y + drift.dy}px, ${cam.z}px)` +
          ` rotateX(${cam.rx + drift.drx}deg) rotateY(${cam.ry + drift.dry}deg) rotateZ(${cam.rz}deg)`;

        const b = travel.blur;
        stage.style.filter = b > 0.15 ? `blur(${b.toFixed(2)}px)` : "none";
      }

      applyCamera();

      // Initial visual setup
      gsap.set(["#plane-home", "#plane-workflows", "#plane-features", "#plane-pricing", "#plane-case-study"], {
        opacity: 0,
      });

      // ── Organic Cinematic Drift ──
      const driftDriver = { p: 0 };
      tl.to(
        driftDriver,
        {
          p: Math.PI * 2 * 1.5,
          duration: 10,
          ease: "none",
          onUpdate: () => {
            drift.dx = Math.sin(driftDriver.p) * 6.5;
            drift.dy = Math.sin(driftDriver.p * 1.2) * 4.5;
            drift.drx = Math.sin(driftDriver.p * 0.75) * 0.35;
            drift.dry = Math.cos(driftDriver.p * 0.85) * 0.45;
            applyCamera();
          },
        },
        0,
      );

      // ── 0.00–1.80  REVEAL: Elevation Lift, Opacity & Luminous Light Sweep ──
      tl.to(
        ["#plane-home", "#plane-workflows", "#plane-features", "#plane-pricing", "#plane-case-study"],
        { opacity: 1, duration: 0.8, ease: "power2.out" },
        0.05,
      );

      tl.fromTo(
        shimmer,
        { transform: "translate(-80%, -80%)" },
        {
          transform: "translate(80%, 80%)",
          duration: 1.8,
          ease: "power2.inOut",
        },
        0.15,
      );

      // Settle into Beat 1: Home Hero
      tl.fromTo(
        cam,
        { x: 80, y: 20, z: -870, rx: 16, ry: 21, rz: 2.4 },
        {
          x: 40,
          y: -140,
          z: -830,
          rx: 9,
          ry: 12,
          rz: 1.1,
          duration: 1.55,
          ease: "power2.out",
          onUpdate: applyCamera,
        },
        0.35,
      );

      // ── 1.80–4.20  BEAT 2: Orbital Swoop to Specialty Workflows & Hospital Badges ──
      tl.to(
        cam,
        {
          x: -2350,
          y: -220,
          z: -840,
          rx: 11,
          ry: -16,
          rz: -1.8,
          duration: 2.2,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        2.0,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 3.2, duration: 0.35, ease: "power1.in", onUpdate: applyCamera },
        2.0,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.85, ease: "power3.out", onUpdate: applyCamera },
        2.7,
      );

      // ── 4.20–6.60  BEAT 3: Orbital Glide into Automation Features ──
      tl.to(
        cam,
        {
          x: -4700,
          y: -180,
          z: -820,
          rx: 12,
          ry: 15,
          rz: 1.5,
          duration: 2.1,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        4.4,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 3.4, duration: 0.35, ease: "power1.in", onUpdate: applyCamera },
        4.4,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.85, ease: "power3.out", onUpdate: applyCamera },
        5.1,
      );

      // ── 6.60–8.50  BEAT 4: Orbit into Transparent Doctor Pricing ──
      tl.to(
        cam,
        {
          x: -7050,
          y: -200,
          z: -830,
          rx: 10,
          ry: -12,
          rz: -1.3,
          duration: 1.8,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        6.7,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 2.8, duration: 0.3, ease: "power1.in", onUpdate: applyCamera },
        6.7,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.75, ease: "power3.out", onUpdate: applyCamera },
        7.3,
      );

      // ── 8.50–10.0  BEAT 5: Final Multi-Plane Pullback & Settle ──
      tl.to(
        cam,
        {
          x: -4700,
          y: -80,
          z: -2100,
          rx: 16,
          ry: 6,
          rz: 0.8,
          duration: 1.4,
          ease: "power3.out",
          onUpdate: applyCamera,
        },
        8.5,
      );
      tl.fromTo(
        travel,
        { blur: 0 },
        { blur: 2.2, duration: 0.22, ease: "power2.out", onUpdate: applyCamera },
        8.5,
      );
      tl.to(
        travel,
        { blur: 0, duration: 0.7, ease: "power3.out", onUpdate: applyCamera },
        8.8,
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
